        #time-display { font-size: 3em; font-weight: bold; margin: 20px 0; color: #4CAF50; }

        button.active { background-color: #e53935; color: #fff; }
        
        #filter-section { background-color: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #444; display: flex; flex-direction: column; justify-content: center; gap: 15px; align-items: center; width: 90%; max-width: 950px; margin: 0 auto 30px auto; box-sizing: border-box; }

        .filter-group { display: flex; align-items: center; gap: 10px; }
        .filter-group label { color: #f5a623; font-weight: bold; }
        .filter-group input { padding: 8px; border-radius: 4px; border: 1px solid #555; background: #252525; color: #fff; width: 100px; font-size: 16px; text-align: right; }
        .filter-group select { padding: 8px; border-radius: 4px; border: 1px solid #555; background: #333; color: #fff; font-size: 16px; cursor: pointer; width: 110px; }
        #target-bb { width: 60px; text-align: center; }
        #apply-btn { padding: 10px 20px; font-size: 1em; background-color: #4CAF50; color: #fff; border-radius: 4px; margin: 0; }

        table { margin: 0 auto 30px auto; border-collapse: collapse; width: 90%; max-width: 950px; background-color: #1e1e1e; }
        th, td { border: 1px solid #444; padding: 10px; text-align: center; }
        th { background-color: #333; color: #f5a623; }
        .highlight { background-color: #ff9800 !important; color: #000; font-weight: bold; }
        .past { color: #777; }
        
        @keyframes flash {
            0%, 100% { background-color: #121212; }
            50% { background-color: #b71c1c; }
        }
        .flashing { animation: flash 1s infinite; }

        let filteredSchedule = []; 
        let alarmEnabled = false;
        let lastAlarmedTime = "";
        let activeTargetBB = 12;

        function formatTimeStr(timeStr) {
            let [h, m] = timeStr.split(':');
            return `${h.padStart(2, '0')}:${m.padStart(2, '0')}`;
        }

        function calculateRegTime(startTimeStr, tourneyName, targetBB) {
            let spec = tourneySpecs[tourneyName];
            if (!spec) return startTimeStr;

            let [hour, minute] = startTimeStr.split(':').map(Number);
            let startMins = hour * 60 + minute;

            if (targetBB === null) {
                let maxRegRealMins = startMins + spec.maxReg;
                let fHour = Math.floor(maxRegRealMins / 60) % 24;
                let fMin = maxRegRealMins % 60;
                return `${String(fHour).padStart(2, '0')}:${String(fMin).padStart(2, '0')}`;
            }

            let targetLevel = 1;
            for (let i = 1; i < blinds.length; i++) {
                let bb = spec.startChip / blinds[i];
                if (bb < targetBB) {
                    targetLevel = i - 1; 
                    break;
                }
            }
            if (targetLevel < 1) targetLevel = 1;

            let gameMinutes = (targetLevel - 1) * spec.blindUp;
            let currentRealMins = startMins;
            let left = gameMinutes;

            while (left > 0) {
                let m = currentRealMins % 60;
                if (m >= 55) {
                    currentRealMins++;
                } else {
                    currentRealMins++;
                    left--;
                }
            }

            let maxRegRealMins = startMins + spec.maxReg;
            let finalRealMins = Math.min(currentRealMins, maxRegRealMins);

            let fHour = Math.floor(finalRealMins / 60) % 24;
            let fMin = finalRealMins % 60;
            return `${String(fHour).padStart(2, '0')}:${String(fMin).padStart(2, '0')}`;
        }

        function saveFilters() {
            localStorage.setItem('alarmTargetBB', document.getElementById('target-bb').value);
            localStorage.setItem('alarmMinVal', document.getElementById('min-val').value);
            localStorage.setItem('alarmMinUnit', document.getElementById('min-unit').value);
            localStorage.setItem('alarmMaxVal', document.getElementById('max-val').value);
            localStorage.setItem('alarmMaxUnit', document.getElementById('max-unit').value);
        }

        function loadFilters() {
            if (localStorage.getItem('alarmTargetBB') !== null) {
                document.getElementById('target-bb').value = localStorage.getItem('alarmTargetBB');
            }
            if (localStorage.getItem('alarmMinVal') !== null) {
                document.getElementById('min-val').value = localStorage.getItem('alarmMinVal');
            }
            if (localStorage.getItem('alarmMinUnit') !== null) {
                document.getElementById('min-unit').value = localStorage.getItem('alarmMinUnit');
            }
            
            updateMaxUnitOptions();

            if (localStorage.getItem('alarmMaxVal') !== null) {
                document.getElementById('max-val').value = localStorage.getItem('alarmMaxVal');
            }
            if (localStorage.getItem('alarmMaxUnit') !== null) {
                const maxUnitEl = document.getElementById('max-unit');
                const savedMaxUnit = localStorage.getItem('alarmMaxUnit');
                if (maxUnitEl.querySelector(`option[value="${savedMaxUnit}"]`)) {
                    maxUnitEl.value = savedMaxUnit;
                }
            }
        }

        function updateMaxUnitOptions() {
            const minUnitVal = document.getElementById('min-unit').value;
            const maxUnitEl = document.getElementById('max-unit');
            const currentMaxVal = maxUnitEl.value;

            maxUnitEl.innerHTML = '';

            if (minUnitVal === '1') {
                maxUnitEl.innerHTML += '<option value="1">선택 안함</option>';
                maxUnitEl.innerHTML += '<option value="10000">만</option>';
                maxUnitEl.innerHTML += '<option value="100000000">억</option>';
            } else if (minUnitVal === '10000') {
                maxUnitEl.innerHTML += '<option value="10000">만</option>';
                maxUnitEl.innerHTML += '<option value="100000000">억</option>';
            } else if (minUnitVal === '100000000') {
                maxUnitEl.innerHTML += '<option value="100000000">억</option>';
            }

            if (maxUnitEl.querySelector(`option[value="${currentMaxVal}"]`)) {
                maxUnitEl.value = currentMaxVal;
            } else {
                maxUnitEl.value = maxUnitEl.options[0].value;
            }
        }

        document.getElementById('min-unit').addEventListener('change', updateMaxUnitOptions);

        function applyFilter() {
            const today = new Date().getDay();
            const isWeekend = (today === 0 || today === 6);

            let targetBBRaw = document.getElementById('target-bb').value.trim();
            if (targetBBRaw === '') {
                activeTargetBB = null;
            } else {
                let parsed = parseFloat(targetBBRaw);
                activeTargetBB = (isNaN(parsed) || parsed <= 0) ? null : parsed;
            }

            const thRegTime = document.getElementById('th-reg-time');
            if (activeTargetBB === null) {
                thRegTime.innerText = "Max Late Reg. Time";
            } else {
                thRegTime.innerText = activeTargetBB + "BB Reg. Time";
            }

            let minInput = parseFloat(document.getElementById('min-val').value);
            let minUnit = parseFloat(document.getElementById('min-unit').value);
            let minBuyin = isNaN(minInput) ? 0 : minInput * minUnit;

            let maxInput = parseFloat(document.getElementById('max-val').value);
            let maxUnit = parseFloat(document.getElementById('max-unit').value);
            let maxBuyin = isNaN(maxInput) ? Infinity : maxInput * maxUnit;

            filteredSchedule = rawSchedule.filter(item => {
                if (item.type === "평일" && isWeekend) return false;
                if (item.type === "주말" && !isWeekend) return false;
                if (item.buyin < minBuyin || item.buyin > maxBuyin) return false;
                return true;
            }).map(item => {
                let dynamicRegTime = calculateRegTime(item.time, item.name, activeTargetBB);
                return {
                    ...item,
                    regTime: dynamicRegTime,
                    formattedRegTime: formatTimeStr(dynamicRegTime)
                };
            }).sort((a, b) => a.formattedRegTime.localeCompare(b.formattedRegTime));

            const now = new Date();
            const currentTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            renderTable(currentTimeStr);
        }

        const tbody = document.getElementById('schedule-body');

        function renderTable(currentTimeStr) {
            tbody.innerHTML = '';
            
            if (filteredSchedule.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="color:#888; padding: 20px;">조건에 맞는 토너먼트가 없습니다.</td></tr>`;
                return;
            }

            filteredSchedule.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.id = `row-${index}`;
                
                if (item.formattedRegTime < currentTimeStr) {
                    tr.className = 'past';
                }

                tr.innerHTML = `
                    <td>${item.time}</td>
                    <td>${item.name}</td>
                    <td>${item.regTime}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 2. 모바일 시스템 푸시 알림 함수
        function playAlarm(tournamentName) {
            if (!alarmEnabled) return;
            
            document.body.classList.add('flashing');
            setTimeout(() => document.body.classList.remove('flashing'), 5000);

            let bbText = activeTargetBB === null ? "맥스 레잇" : `${activeTargetBB}BB`;
            
            if (Notification.permission === "granted") {
                navigator.serviceWorker.ready.then(function(registration) {
                    registration.showNotification("레지 시간 알림", {
                        body: `[${tournamentName}] ${bbText} 레지 마감 시간입니다!`,
                        icon: "icon.png",
                        vibrate: [200, 100, 200]
                    });
                });
            }
        }

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const currentTimeStr = `${h}:${m}`;
            
            document.getElementById('time-display').textContent = `${h}:${m}:${s}`;

            let nextAlarmFound = false;
            
            filteredSchedule.forEach((item, index) => {
                const row = document.getElementById(`row-${index}`);
                if (!row) return;

                if (item.formattedRegTime === currentTimeStr) {
                    row.className = 'highlight';
                    if (lastAlarmedTime !== currentTimeStr) {
                        playAlarm(item.name);
                        lastAlarmedTime = currentTimeStr;
                    }
                } else if (item.formattedRegTime > currentTimeStr) {
                    row.classList.remove('highlight');
                    if (!nextAlarmFound) {
                        let bbLabel = activeTargetBB === null ? "Max Late" : `${activeTargetBB}BB`;
                        document.getElementById('next-alarm').textContent = `다음 ${bbLabel} 레지: [${item.regTime}] ${item.name}`;
                        nextAlarmFound = true;
                    }
                }
            });

            if (!nextAlarmFound) {
                document.getElementById('next-alarm').textContent = "오늘 조건에 맞는 남은 일정이 없습니다.";
            }
        }

        // 3. 버튼 클릭 시 권한 요청 및 상태 토글
        document.getElementById('toggle-btn').addEventListener('click', function() {
            if (!alarmEnabled) {
                // 알림 권한 요청 (최초 1회 브라우저 팝업 뜸)
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        alarmEnabled = true;
                        this.textContent = "알람 끄기 (현재 작동 중)";
                        this.classList.add('active');
                    } else {
                        alert("알림 권한을 허용해야 푸시를 받을 수 있습니다.");
                    }
                });
            } else {
                alarmEnabled = false;
                this.textContent = "알람 켜기 (현재 꺼짐)";
                this.classList.remove('active');
                document.body.classList.remove('flashing');
            }
        });

        document.getElementById('apply-btn').addEventListener('click', function() {
            saveFilters(); 
            applyFilter();
            updateClock();
        });

        loadFilters(); 
        applyFilter(); 
        setInterval(updateClock, 1000);
        updateClock();
